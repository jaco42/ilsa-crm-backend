services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ilsa_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ilsa_crm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # porta NON esposta all'esterno — solo il backend ci parla dentro

  backend:
    build: .
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data:
