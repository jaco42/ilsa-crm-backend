server {
    listen 80;
    server_name api.ilsacrmbackend.online;

    # Certbot userà questo per la verifica SSL — non toccare
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tutto il resto → redirect a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.ilsacrmbackend.online;

    ssl_certificate     /etc/letsencrypt/live/api.ilsacrmbackend.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ilsacrmbackend.online/privkey.pem;

    # Limite upload file SAP
    client_max_body_size 500M;

    # Timeout alti per l'import SAP (streaming lungo)
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 60s;

    # Disabilita il buffering — necessario per lo streaming SSE dell'import
    proxy_buffering off;
    proxy_cache off;

    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
